# Deploy no Render (plano gratuito). O serviço usa a pasta ellena-hub inteira,
# porque a API lê handoff/ e mcp-server/src/hub.mjs ao lado de app/.
services:
  - type: web
    name: ellena-hub
    runtime: node
    plan: free
    rootDir: .
    buildCommand: "npm --prefix mcp-server ci --omit=dev"   # o endpoint /mcp usa o SDK do mcp-server
    startCommand: "node app/src/server.mjs"
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: APP_PASSWORD
        sync: false   # você define a senha no painel do Render; ela não vai para o repositório
      - key: MCP_TOKEN
        sync: false   # token do MCP para o time; sem ele, /mcp fica desligado (404)
      - key: GITHUB_REPO
        value: luizbaptistella/Hub-Onboarding   # onde as propostas do modo de edição viram PR
      - key: GITHUB_TOKEN
        sync: false   # token fine-grained só deste repo (Contents e Pull requests: escrita); sem ele, salvar propostas fica desligado
