<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Componentes do DS · render</title>
<!-- Renderiza componentes reais do DS Palmeiras · Onboarding (ds/bundle.js, copiado do artefato do DS) com as props de uma tela.
     Usado pela ficha técnica do hub: window.dsRender(itens, opções). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="design-system/tokens-onboarding.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #f8f9fa; font-family: "Inter", system-ui, sans-serif; }
  #root { display: flex; flex-direction: column; gap: 14px; padding: 12px; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .cap { font: 600 11px/1.3 system-ui, sans-serif; color: #616674; text-transform: uppercase; letter-spacing: .05em; }
  .stage { position: relative; }
  .err { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #b91c1c; background: #fef2f2; border-radius: 6px; padding: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script>
(function () {
  "use strict";
  var h = React.createElement, root = null;
  var Boundary = (function () {
    function B(p) { React.Component.call(this, p); this.state = { error: null }; }
    B.prototype = Object.create(React.Component.prototype);
    B.getDerivedStateFromError = function (e) { return { error: e }; };
    B.prototype.render = function () { return this.state.error ? h("div", { className: "err" }, "Não foi possível renderizar: " + String(this.state.error.message || this.state.error)) : this.props.children; };
    return B;
  })();
  function fixProps(p) {
    var out = {};
    Object.keys(p || {}).forEach(function (k) {
      var v = p[k];
      if (v === "(fn)") v = function () {};
      out[k] = v;
    });
    return out;
  }
  // itens: [{ key, label, component, props, width }]
  window.dsRender = function (items, opts) {
    opts = opts || {};
    var P = window.PalmeirasOnboarding;
    if (!root) root = ReactDOM.createRoot(document.getElementById("root"));
    var cells = items.map(function (it, i) {
      var C = P && P[it.component];
      var props = fixProps(it.props), children = props.children;
      delete props.children;
      var body = C ? h(Boundary, null, h(C, props, children)) : h("div", { className: "err" }, it.component + " não existe no bundle do DS.");
      return h("div", { className: "cell", key: it.key || i },
        opts.captions === false ? null : h("span", { className: "cap" }, it.label || ""),
        h("div", { className: "stage", id: "r" + i, style: { width: (it.width || opts.width || 327) + "px" } }, body));
    });
    root.render(h(React.Fragment, null, cells));
    return new Promise(function (res) { requestAnimationFrame(function () { requestAnimationFrame(function () { res(document.body.scrollHeight); }); }); });
  };
  window.dsReady = Boolean(window.PalmeirasOnboarding && window.React && window.ReactDOM);
})();
</script>
</body>
</html>
