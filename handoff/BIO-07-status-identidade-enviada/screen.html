<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIO-07 · Status · identidade enviada · Padrão</title>
<!-- Handoff Palmeiras · Onboarding. Tela BIO-07 (liv-done), variante "Padrão".
     Marcação renderizada do protótipo (inclui o conteúdo gerado por script), isolada desta tela.
     Comportamento, regras e ligações: spec.md nesta pasta. Fonte de verdade de componentes: DS Palmeiras · Onboarding. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/tokens-onboarding.css">
<link rel="stylesheet" href="../../design-system/components.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../liveness.css">
<link rel="stylesheet" href="../../area.css">
<link rel="stylesheet" href="../../photo.css">
<link rel="stylesheet" href="../../header.css">
<link rel="stylesheet" href="../../proto-ds.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../../select.css">
<link rel="stylesheet" href="../../desvincular.css">
<link rel="stylesheet" href="../../familiar-busca.css">
<link rel="stylesheet" href="../../familiar-pendentes.css">
<!-- Moldura fixa 375×812 em qualquer largura de janela (o app.css troca para altura automática abaixo de 720px). -->
<!-- O components.css dá padding de 16px ao body; aqui a moldura fica colada no canto superior esquerdo. -->
<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>
</head>
<body>
<div class="device">
<section class="screen screen-status" id="liv-done" data-screen="">
      <div class="statusbar statusbar-dark"><span>9:41</span></div>
      <div class="po-status-screen">
        <div class="po-status-screen-head">
          <img src="../../design-system/assets/status-badge-success.svg" alt="" width="80" height="80">
          <h1 class="po-status-screen-title">Recebemos seus dados cadastrais!</h1>
        </div>
        <div class="po-status-screen-body">
          <ol class="po-journey">
            <li class="po-journey-step po-journey-done">
              <div class="po-journey-row"><span class="po-journey-circle"><span class="po-icon s26 bold" aria-hidden="true">check</span></span><span class="po-journey-label">Cadastro</span></div>
              <span class="po-journey-connector" aria-hidden="true"></span>
            </li>
            <li class="po-journey-step po-journey-done">
              <div class="po-journey-row"><span class="po-journey-circle"><span class="po-icon s26 bold" aria-hidden="true">check</span></span><span class="po-journey-label">Captura de documentos</span></div>
              <span class="po-journey-connector" aria-hidden="true"></span>
            </li>
            <li class="po-journey-step po-journey-done">
              <div class="po-journey-row"><span class="po-journey-circle"><span class="po-icon s26 bold" aria-hidden="true">check</span></span><span class="po-journey-label">Biometria facial</span></div>
              <span class="po-journey-connector" aria-hidden="true"></span>
            </li>
            <li class="po-journey-step po-journey-current" aria-current="step">
              <div class="po-journey-row">
                <span class="po-journey-circle"><span class="po-icon s28" aria-hidden="true">assignment_turned_in</span></span>
                <span class="po-journey-pill"><span class="po-journey-label">Validação de benefícios</span></span>
              </div>
            </li>
          </ol>
        </div>
        <div class="po-status-screen-foot">
          <div class="po-countdown">
            <span class="po-countdown-number" id="lv-done-count" aria-hidden="true">10</span>
            <p class="po-countdown-text" id="lv-done-text">Redirecionando para a próxima etapa...</p>
          </div>
          <div class="lv-done-actions" id="lv-done-actions">
            <button type="button" class="po-btn po-btn-sm lv-done-now" id="lv-done-now"><span class="po-btn-content"><span>Continuar agora</span><span class="po-icon s18" aria-hidden="true">arrow_forward</span></span></button>
          </div>
          <p class="po-sr-only" id="lv-done-live" role="status" aria-live="polite">Redirecionando para a próxima etapa em 10 segundos. </p>
        </div>
      </div>
    </section>

</div>
</body>
</html>
