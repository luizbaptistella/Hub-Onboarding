<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD-01 · Cadastro · Dados pessoais · Padrão</title>
<!-- Handoff Palmeiras · Onboarding. Tela CAD-01 (cadastro), variante "Padrão".
     Marcação renderizada do protótipo (inclui o conteúdo gerado por script), isolada desta tela.
     Comportamento, regras e ligações: spec.md nesta pasta. Fonte de verdade de componentes: DS Palmeiras · Onboarding. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/tokens-onboarding.css">
<link rel="stylesheet" href="../../design-system/components.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../liveness.css">
<link rel="stylesheet" href="../../area.css">
<link rel="stylesheet" href="../../photo.css">
<link rel="stylesheet" href="../../header.css">
<link rel="stylesheet" href="../../proto-ds.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../../select.css">
<link rel="stylesheet" href="../../desvincular.css">
<link rel="stylesheet" href="../../familiar-busca.css">
<link rel="stylesheet" href="../../familiar-pendentes.css">
<!-- Moldura fixa 375×812 em qualquer largura de janela (o app.css troca para altura automática abaixo de 720px). -->
<!-- O components.css dá padding de 16px ao body; aqui a moldura fica colada no canto superior esquerdo. -->
<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>
</head>
<body>
<div class="device">
<section class="screen" id="cadastro" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-entry">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar" data-go="login"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>
        <div class="po-header-center"><div class="po-progress po-header-progress"><span class="po-progress-label">Etapa 1 de 4 · Cadastro</span><div class="po-progress-track" role="progressbar" aria-label="Cadastro" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-valuetext="Etapa 1 de 4"><span class="po-progress-seg po-progress-done"></span><span class="po-progress-seg"></span><span class="po-progress-seg"></span><span class="po-progress-seg"></span></div></div></div>
        <div class="po-header-slot po-header-slot-end"><button type="button" class="po-lang" aria-haspopup="menu" aria-expanded="false" aria-label="Idioma: Português, PT"><img src="../../design-system/assets/flag-br.png" alt=""><span class="po-lang-code">PT</span><span class="po-icon s18" aria-hidden="true">expand_more</span></button></div>
      </header>

      <form class="page page-ds" id="cadastro-form" novalidate="">
        <div class="heading-tabs">
          <div class="po-heading">
            <h1 class="po-heading-title">Bem-vindo(a) ao Palmeiras</h1>
            <p class="po-heading-sub">Crie o seu cadastro em poucos passos</p>
          </div>
          <div class="po-tabs" role="tablist" aria-label="Nacionalidade">
            <button type="button" role="tab" class="po-tab po-tab-active" aria-selected="true">Brasileiro</button>
            <button type="button" role="tab" class="po-tab" aria-selected="false">Estrangeiro</button>
          </div>
        </div>

        <div class="fields fields-edit">
          <div class="po-field">
            <label class="po-field-label" for="cad-cpf">Número do seu CPF</label>
            <input class="po-input po-input-md" id="cad-cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" data-mask="cpf">
          </div>
          <div class="po-field">
            <label class="po-field-label" for="cad-nasc">Data de nascimento</label>
            <input class="po-input po-input-md" id="cad-nasc" name="nascimento" inputmode="numeric" placeholder="DD/MM/AAAA" data-mask="data">
          </div>
          <div class="po-field">
            <label class="po-field-label" for="cad-cel">Número do seu celular</label>
            <input class="po-input po-input-md" id="cad-cel" name="celular" inputmode="tel" autocomplete="tel-national" placeholder="(00) 00000-0000" data-mask="celular">
          </div>
          <div class="po-field">
            <label class="po-field-label" for="cad-email">Seu e-mail</label>
            <input class="po-input po-input-md" id="cad-email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com">
          </div>
        </div>

        <div class="foot">
          <div class="checks">
            <div class="po-field"><label class="po-check"><input type="checkbox" class="po-check-input" id="cad-termos" name="termos"><span class="po-check-box" aria-hidden="true"><span class="po-icon s14 bold" aria-hidden="true">check</span></span><span class="po-check-label">Li e concordo com os <button type="button" class="po-link po-link-inline proto-soon">Termos de Uso</button>.</span></label></div>
            <label class="po-check"><input type="checkbox" class="po-check-input" id="cad-marketing" name="marketing"><span class="po-check-box" aria-hidden="true"><span class="po-icon s14 bold" aria-hidden="true">check</span></span><span class="po-check-label">Quero receber novidades e ofertas do Palmeiras.</span></label>
          </div>
          <button type="submit" class="po-btn po-btn-primary po-btn-block" id="cadastro-submit"><span class="po-btn-content">Iniciar validação</span></button>
        </div>
      </form>

      <footer class="po-legal">© 2026 Ellena. Todos os direitos reservados.</footer>
    </section>

</div>
</body>
</html>
