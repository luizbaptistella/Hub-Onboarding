<!-- Moldura fixa 375×812 em qualquer largura de janela (o app.css troca para altura automática abaixo de 720px). -->
<!-- O components.css dá padding de 16px ao body; aqui a moldura fica colada no canto superior esquerdo. -->
<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>
</head>
<body>
<div class="device">
<section class="screen screen-page" id="editar-celular" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-task">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar" data-go="otp-sms"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>
        <div class="po-header-center"><p class="po-header-title">Editar celular</p></div>
        <div class="po-header-slot po-header-slot-end"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Ajuda" title="Ajuda"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">help</span></span></button></div>
      </header>
      <form class="page page-ds" id="editar-celular-form" novalidate="">
        <div class="po-heading po-heading-spaced">
          <h1 class="po-heading-title po-heading-neutral">Atualize seu celular</h1>
          <p class="po-heading-sub">Informe o novo número para receber um novo código de verificação.</p>
        </div>
        <div class="fields fields-edit">
          <div class="po-field">
            <label class="po-field-label" for="ed-cel">Celular</label>
            <input class="po-input po-input-md" id="ed-cel" name="valor" inputmode="tel" autocomplete="tel-national" placeholder="(00) 00000-0000" data-mask="celular">
          </div>
          <div class="po-field">
            <label class="po-field-label" for="ed-cel2">Confirmar Celular</label>
            <input class="po-input po-input-md" id="ed-cel2" name="confirmacao" inputmode="tel" placeholder="(00) 00000-0000" data-mask="celular">
          </div>
        </div>
        <div class="foot">
          <button type="submit" class="po-btn po-btn-primary po-btn-block"><span class="po-btn-content">Confirmar e enviar código</span></button>
        </div>
      </form>
      <footer class="po-legal">© 2026 Ellena. Todos os direitos reservados.</footer>
    </section>

</div>
</body>
