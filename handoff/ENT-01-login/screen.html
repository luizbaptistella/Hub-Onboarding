<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENT-01 · Login · Padrão</title>
<!-- Handoff Palmeiras · Onboarding. Tela ENT-01 (login), variante "Padrão".
     Marcação renderizada do protótipo (inclui o conteúdo gerado por script), isolada desta tela.
     Comportamento, regras e ligações: spec.md nesta pasta. Fonte de verdade de componentes: DS Palmeiras · Onboarding. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/tokens-onboarding.css">
<link rel="stylesheet" href="../../design-system/components.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../liveness.css">
<link rel="stylesheet" href="../../area.css">
<link rel="stylesheet" href="../../photo.css">
<link rel="stylesheet" href="../../header.css">
<link rel="stylesheet" href="../../proto-ds.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../../select.css">
<link rel="stylesheet" href="../../desvincular.css">
<link rel="stylesheet" href="../../familiar-busca.css">
<link rel="stylesheet" href="../../familiar-pendentes.css">
<!-- Moldura fixa 375×812 em qualquer largura de janela (o app.css troca para altura automática abaixo de 720px). -->
<!-- O components.css dá padding de 16px ao body; aqui a moldura fica colada no canto superior esquerdo. -->
<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>
</head>
<body>
<div class="device">
<section class="screen screen-login" id="login" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-entry">
        <div class="po-header-slot"></div>
        <div class="po-header-center"><p class="po-header-title">Login</p></div>
        <div class="po-header-slot po-header-slot-end"><button type="button" class="po-lang" aria-haspopup="menu" aria-expanded="false" aria-label="Idioma: Português, PT"><img src="../../design-system/assets/flag-br.png" alt=""><span class="po-lang-code">PT</span><span class="po-icon s18" aria-hidden="true">expand_more</span></button></div>
      </header>

      <form class="page page-ds" id="login-form" novalidate="">
        <div class="logo" aria-hidden="true">
          <img class="logo-bg" src="../../design-system/assets/logo-palmeiras-bg-ellipse.svg" alt="">
          <img class="logo-mark" src="../../design-system/assets/logo-palmeiras.png" alt="">
        </div>

        <div class="po-heading">
          <h1 class="po-heading-title">Faça seu login</h1>
          <p class="po-heading-sub">Faça seu login para começar ou cadastre-se.</p>
        </div>

        <div class="po-alert po-alert-info" id="login-conta-encerrada" role="status" hidden=""><span class="po-alert-icon"><span class="po-icon" aria-hidden="true">info</span></span><div class="po-alert-text"><p class="po-alert-title">Sua conta foi encerrada.</p><p class="po-alert-body">O cadastro ficou inativo. Para voltar, fale com o atendimento.</p></div></div>

        <div class="fields fields-edit">
          <div class="po-field">
            <label class="po-field-label" for="login-cpf">Número do seu CPF</label>
            <input class="po-input po-input-md" id="login-cpf" name="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" data-mask="cpf">
          </div>
          <div class="po-field">
            <label class="po-field-label" for="login-senha">Senha</label>
            <input class="po-input po-input-md" id="login-senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha">
          </div>
          <button type="button" class="po-link proto-soon">Esqueceu sua senha?</button>
        </div>

        <div class="buttons">
          <button type="submit" class="po-btn po-btn-primary po-btn-block" id="login-submit"><span class="po-btn-content">Entrar</span></button>
          <button type="button" class="po-btn po-btn-accent po-btn-block" data-go="cadastro"><span class="po-btn-content">Criar cadastro</span></button>
        </div>

        <div class="divider" role="separator"><span></span><p>ou entrar com:</p><span></span></div>

        <div class="social-row">
          <button type="button" class="social" aria-label="Entrar com Google"><img src="../../design-system/assets/icon-google.svg" alt="" width="32" height="32"></button>
          <button type="button" class="social" aria-label="Entrar com Apple"><img src="../../design-system/assets/icon-apple.svg" alt="" width="32" height="32"></button>
          <button type="button" class="social" aria-label="Entrar com Microsoft"><span class="ms" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
        </div>
      </form>

      <footer class="po-legal">© 2026 Ellena. Todos os direitos reservados.</footer>
    </section>

</div>
</body>
</html>
