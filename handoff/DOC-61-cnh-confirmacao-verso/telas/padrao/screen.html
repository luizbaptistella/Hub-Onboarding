html,body{margin:0;padding:0;background:var(--bg-surface)}
.est-device{width:375px;min-height:812px;display:flex;flex-direction:column;background:var(--bg-surface)}
.est-body{flex:1;display:flex;flex-direction:column;gap:var(--space-stack-loose);padding:var(--space-300) var(--space-page-inline) 0}
.est-legal{margin-top:auto}
/* Tutorial ocupa a altura da tela e o botão do passo fica no rodapé (layout da página; o componente do DS não muda). */
.est-device > .po-tutorial-carousel,.po-tutorial-carousel .po-tutorial-slide,.po-tutorial-carousel .po-tutorial,.po-tutorial-carousel .po-tutorial-body{flex:1 1 auto}
.po-tutorial-carousel .po-tutorial-body > .po-btn{margin-top:auto}
/* Tela com conteúdo que estica e ações no rodapé (confirmação de foto). */
.est-device:has(.est-body-fill){height:812px;min-height:0}
.est-body-fill{min-height:0;padding-bottom:var(--space-300)}
.est-photo{flex:1 1 auto;min-height:0;display:flex}
.est-photo > *{flex:1 1 auto;height:100%}
.est-actions{display:flex;flex-direction:column;gap:var(--space-stack-related);margin-top:auto}
/* Barra de status do celular: mock do sistema, não implementar. */
.est-statusbar{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-300) 0 var(--space-400);background:var(--bg-surface);color:var(--text-default);font:600 15px/1 var(--font-body)}
.est-statusbar-icons{display:flex;align-items:center;gap:6px;fill:currentColor;color:inherit}
.est-statusbar-dark{background:var(--camera-bg);color:var(--camera-fg)}
/* Câmera: ocupa a altura da tela abaixo da barra de status; a foto faz o papel do vídeo. */
.est-device-camera{height:812px;min-height:0;background:var(--camera-bg)}
.est-device-camera > .po-camera{flex:1 1 auto;min-height:0}
.est-camera-feed{cursor:pointer}
/* Moldura do código (verso do CNH): faixa horizontal 335x93 em y=364 (Figma 2788:34736), no lugar da moldura vertical do DS. */
.est-code-strip .po-camera-window{display:none}
.est-code-strip.is-done .po-camera-viewport::after{border-color:#10a066}
/* Upload da frente e do verso: dois UploadArea empilhados, ocupando o espaço entre o título e o botão. */
.est-uploads{display:flex;flex-direction:column;gap:var(--space-stack-section);flex:1 1 auto;min-height:0}
.est-uploads > *{flex:1 1 0}
/* Lista de motivos da falha (DOC-11). */
.est-motivos{display:flex;flex-direction:column;gap:8px;font:400 14px/20px var(--font-body);color:var(--text-default)}
.est-motivos-title{margin:0;font-weight:600}
.est-motivos ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* Miniatura da imagem enviada: substitui o ícone de documento dentro do UploadArea do DS. */
.est-thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;margin-right:12px}
/* Tela de status: barra de status branca sobre o verde da marca. */
.est-statusbar-light{background:transparent;color:#ffffff}
.est-device > .po-status-screen{flex:1 1 auto}
/* QR Code do verso do DPRNM: moldura quadrada em volta do QR (canto superior direito da foto). */
.est-qr-frame .po-camera-window{display:none}
.est-qr-frame .po-camera-viewport::after{content:"";position:absolute;left:296px;top:132px;width:60px;height:60px;border:2px solid var(--camera-fg);border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.4);pointer-events:none;z-index:2}
.est-qr-frame.is-done .po-camera-viewport::after{border-color:#10a066}
.est-qr-frame .po-camera-msg .po-icon{display:none}
/* Segundo tutorial do fluxo (verso do CNH e do DPRNM): o número visível do passo é 2, como na sequência de telas. */
.est-tutorial-2 .po-tutorial-num > span:first-child{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:0;line-height:0}
.est-tutorial-2 .po-tutorial-num > span:first-child::after{content:"2";display:block;font-size:var(--type-numeral-size);line-height:var(--type-numeral-line-height);font-weight:var(--type-numeral-weight)}
/* Formulário (CNH): campos empilhados. */
.est-form{display:flex;flex-direction:column;gap:var(--space-stack-section)}
/* Sucesso na faixa do topo: sem o ícone de check (a mensagem já diz o resultado). */
.est-code-strip .po-camera-msg .po-icon{display:none}
.est-code-strip .po-camera-viewport::after{content:"";position:absolute;left:20px;top:264px;width:335px;height:93px;border:2px solid var(--camera-fg);border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.4);pointer-events:none;z-index:2}
</style>
</head>
