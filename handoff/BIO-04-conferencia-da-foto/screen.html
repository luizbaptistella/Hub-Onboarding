<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>

<body>
<div class="device">
<section class="screen screen-page" id="liv-review" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-module">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar" data-go="liv-face"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>
        <div class="po-header-center"><div class="po-progress po-header-progress"><span class="po-progress-label">Etapa 3 de 4 · Biometria facial</span><div class="po-progress-track" role="progressbar" aria-label="Biometria facial" aria-valuemin="1" aria-valuemax="4" aria-valuenow="3" aria-valuetext="Etapa 3 de 4"><span class="po-progress-seg po-progress-done"></span><span class="po-progress-seg po-progress-done"></span><span class="po-progress-seg po-progress-done"></span><span class="po-progress-seg"></span></div></div></div>

      </header>
      <div class="lv-body">
        <div class="po-image po-image-rounded" role="img" aria-label="Foto capturada do rosto" style="height:320px"><div class="po-image-placeholder"><span class="po-icon" aria-hidden="true">image</span></div></div>
        <div class="po-heading po-heading-spaced">
          <h1 class="po-heading-title po-heading-neutral">Confira se sua foto está legível.</h1>
          <p class="po-heading-sub">Confira se sua foto está nítida para agilizar a análise.</p>
        </div>
        <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px">
          <button type="button" class="po-btn po-btn-primary po-btn-block" data-go="liv-done"><span class="po-btn-content"><span>Salvar e continuar</span><span class="po-icon s18" aria-hidden="true">arrow_forward</span></span></button>
          <button type="button" class="po-btn po-btn-secondary po-btn-block" data-go="liv-face"><span class="po-btn-content"><span>Tirar outra foto</span><span class="po-icon s18" aria-hidden="true">photo_camera</span></span></button>
        </div>
      </div>
    </section>

</div>
