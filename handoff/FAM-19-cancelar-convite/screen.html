<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAM-19 · Cancelar convite (modal) · Padrão</title>
<!-- Handoff Palmeiras · Onboarding. Tela FAM-19 (proposta, ainda não validada), variante "Padrão".
     Modal de confirmação sobre Meus familiares. Usa o mesmo padrão do modal Desvincular (desv-*). Comportamento: spec.md nesta pasta.
     Fonte de verdade de componentes: DS Palmeiras · Onboarding. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/tokens-onboarding.css">
<link rel="stylesheet" href="../../design-system/components.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../liveness.css">
<link rel="stylesheet" href="../../area.css">
<link rel="stylesheet" href="../../photo.css">
<link rel="stylesheet" href="../../header.css">
<link rel="stylesheet" href="../../proto-ds.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../../select.css">
<link rel="stylesheet" href="../../desvincular.css">
<link rel="stylesheet" href="../../familiar-busca.css">
<link rel="stylesheet" href="../../familiar-pendentes.css">
<!-- Moldura fixa 375×812 em qualquer largura de janela. -->
<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}
/* Local (fora do DS): conteúdo do modal centralizado. */
.cancelar-panel{align-items:center;text-align:center}
.cancelar-panel .desv-actions{width:100%}
.cancelar-panel .desv-icon{width:72px;height:72px}
.cancelar-panel .desv-icon .po-icon{font-size:36px}
/* Modal preso à moldura de 375×812: sem position fixed, que se referencia à janela e sai do celular no hub. */
.device{position:relative;overflow:hidden}
#cancelar-convite-modal{position:absolute;inset:0}
</style>
</head>
<body>
<div class="device">
<section class="screen area-screen" id="cancelar-convite" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-task">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>
        <div class="po-header-center"><p class="po-header-title">Meus familiares</p></div>
        <div class="po-header-slot po-header-slot-end"></div>
      </header>
      <div class="area-body"></div>
      <footer class="po-legal">© 2026 Ellena. Todos os direitos reservados.</footer>
    </section>

<div class="desv-modal" id="cancelar-convite-modal">
  <div class="desv-scrim"></div>
  <div class="desv-panel cancelar-panel" role="alertdialog" aria-modal="true" aria-labelledby="cancelar-convite-title" aria-describedby="cancelar-convite-text">
    <span class="desv-icon"><span class="po-icon s32" aria-hidden="true">mail_off</span></span>
    <h2 class="desv-title" id="cancelar-convite-title">Cancelar convite?</h2>
    <p class="desv-text" id="cancelar-convite-text">O convite para <strong>Roberto Silva</strong> vai ser cancelado. O link deixa de funcionar e o convite sai da lista.</p>
    <div class="desv-actions">
      <button type="button" class="po-btn po-btn-danger po-btn-block"><span class="po-btn-content"><span>Cancelar convite</span></span></button>
      <button type="button" class="po-btn po-btn-secondary po-btn-block"><span class="po-btn-content"><span>Manter convite</span></span></button>
    </div>
  </div>
</div>

</div>
</body>
</html>
