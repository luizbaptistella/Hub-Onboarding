<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>

<body>
<div class="device">
<section class="screen seg-screen" id="seguranca" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-task">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar" data-go="area-cadastro-detalhe"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>

      </header>
      <div class="seg-body">
        <section class="po-list-section">
          <h2 class="po-list-label" id="seg-acesso">Acesso</h2>
          <ul class="po-list" aria-labelledby="seg-acesso">
            <li class="po-list-li"><div class="po-list-item"><span class="po-list-icon"><span class="po-icon s20" aria-hidden="true">password</span></span><span class="po-list-text"><span class="po-list-title">Senha</span><span class="po-list-desc">Alterada há 3 meses</span></span><button type="button" class="po-list-action proto-soon" aria-label="Alterar senha">Alterar</button></div></li>

          </ul>
        </section>

        <section class="po-list-section">
          <h2 class="po-list-label" id="seg-social">Login social</h2>

            <li class="po-list-li"><div class="po-list-item" data-social="" data-on="false" data-name="Apple"><span class="po-list-icon"><img src="../../design-system/assets/icon-apple.svg" alt="" width="20" height="20"></span><span class="po-list-text"><span class="po-list-title">Apple</span><span class="po-list-desc" data-desc="">Não conectado</span></span><button type="button" class="po-list-action" data-toggle="" aria-label="Conectar Apple">Conectar</button></div></li>
            <li class="po-list-li"><div class="po-list-item" data-social="" data-on="false" data-name="Microsoft"><span class="po-list-icon"><span class="seg-row-logo seg-row-ms" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span><span class="po-list-text"><span class="po-list-title">Microsoft</span><span class="po-list-desc" data-desc="">Não conectado</span></span><button type="button" class="po-list-action" data-toggle="" aria-label="Conectar Microsoft">Conectar</button></div></li>

        <ul class="po-list" aria-label="Conta">
          <li class="po-list-li"><button type="button" class="po-list-item po-list-item-link po-list-item-danger" data-go="encerrar-conta"><span class="po-list-icon"><span class="po-icon s20" aria-hidden="true">person_remove</span></span><span class="po-list-text"><span class="po-list-title">Encerrar conta</span></span><span class="po-list-chevron"><span class="po-icon s20" aria-hidden="true">chevron_right</span></span></button></li>
        </ul>

      <footer class="po-legal">© 2026 Ellena. Todos os direitos reservados.</footer>
