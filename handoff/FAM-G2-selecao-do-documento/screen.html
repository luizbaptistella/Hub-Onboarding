<body>
<div class="device">
<section class="screen screen-white" id="fam-g2-documento" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-module">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>
        <div class="po-header-center"><p class="po-header-title">Cadastro do familiar</p></div>
        <div class="po-header-slot po-header-slot-end"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Ajuda" title="Ajuda"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">help</span></span></button></div>
      </header>
      <div class="page page-ds">
        <div class="po-heading heading-doc">
          <h1 class="po-heading-title po-heading-neutral">Escolha um documento</h1>

        </div>

            </label>
          <div class="po-docopt-panel" hidden>
            <button type="button" class="po-action"><span class="po-action-icon"><span class="po-icon s32" aria-hidden="true">photo_camera</span></span><span class="po-action-label">Tirar foto do documento</span><span class="po-action-arrow"><span class="po-icon s20" aria-hidden="true">chevron_right</span></span></button>
            <button type="button" class="po-action"><span class="po-action-icon"><span class="po-icon s32" aria-hidden="true">upload</span></span><span class="po-action-label">Fazer upload do documento</span><span class="po-action-arrow"><span class="po-icon s20" aria-hidden="true">chevron_right</span></span></button>
          </div>
          </div>
          <div class="po-docopt" data-doc="cnh">
            <label class="po-docopt-head" for="doc-cnh">
              <input id="doc-cnh" type="radio" class="po-docopt-input" name="documento" value="cnh">
              <span class="po-docopt-radio" aria-hidden="true"></span>
              <span class="po-docopt-text">
                <span class="po-docopt-title"><span>CNH</span><span class="po-badge po-badge-success">Aprovação mais rápida</span></span>

              </span>
              <span class="po-docopt-chevron"><span class="po-icon s20" aria-hidden="true">keyboard_arrow_down</span></span>
            </label>
          <div class="po-docopt-panel" hidden>
            <button type="button" class="po-action"><span class="po-action-icon"><span class="po-icon s32" aria-hidden="true">photo_camera</span></span><span class="po-action-label">Tirar foto do documento</span><span class="po-action-arrow"><span class="po-icon s20" aria-hidden="true">chevron_right</span></span></button>

          <div class="po-docopt" data-doc="rg">

</div>
<script>
// Como o DS (DocumentOption): a opção escolhida fica marcada e expande com as ações de foto e upload.
// Clicar de novo na opção escolhida colapsa e desmarca. Escolher outra opção fecha a anterior.
(function () {
  var opts = Array.prototype.slice.call(document.querySelectorAll(".po-docopt"));
  function paint(o, on) {
    o.classList.toggle("po-docopt-selected", on);
    var p = o.querySelector(".po-docopt-panel");
    if (p) p.hidden = !on;
    var input = o.querySelector(".po-docopt-input");
    if (input) input.setAttribute("aria-expanded", String(on));
  }
  opts.forEach(function (o) {
    var input = o.querySelector(".po-docopt-input");
    var head = o.querySelector(".po-docopt-head");
    head.addEventListener("click", function (e) {
      if (e.target === input) return; // o clique que chega ao rádio já o marcou: não é um segundo clique
      if (input.checked) {
        // Segundo clique na opção escolhida: colapsa e desmarca (o rádio, por padrão, não desmarca).
        e.preventDefault();
        input.checked = false;
        paint(o, false);
      }
    });
    input.addEventListener("change", function () {
      opts.forEach(function (x) { paint(x, x === o); });
    });
  });
})();
</script>
