<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD-02 · Código por SMS · Padrão</title>
<!-- Handoff Palmeiras · Onboarding. Tela CAD-02 (otp-sms), variante "Padrão".
     Marcação renderizada da implementação atual (inclui o conteúdo gerado por script), isolada desta tela.
     Comportamento, regras e ligações: spec.md nesta pasta. Fonte de verdade de componentes: DS Palmeiras · Onboarding. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/tokens-onboarding.css">
<link rel="stylesheet" href="../../design-system/components.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../liveness.css">
<link rel="stylesheet" href="../../area.css">
<link rel="stylesheet" href="../../photo.css">
<link rel="stylesheet" href="../../header.css">
<link rel="stylesheet" href="../../ajustes-ds.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../../select.css">
<link rel="stylesheet" href="../../desvincular.css">
<link rel="stylesheet" href="../../familiar-busca.css">
<link rel="stylesheet" href="../../familiar-pendentes.css">
<!-- Moldura fixa 375×812 em qualquer largura de janela (o app.css troca para altura automática abaixo de 720px). -->
<!-- O components.css dá padding de 16px ao body; aqui a moldura fica colada no canto superior esquerdo. -->
<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>
</head>
<body>
<div class="device">
<section class="screen screen-page" id="otp-sms" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-module">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar" data-go="cadastro"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>
        <div class="po-header-center"><div class="po-progress po-header-progress"><span class="po-progress-label">Etapa 1 de 4 · Cadastro</span><div class="po-progress-track" role="progressbar" aria-label="Cadastro" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-valuetext="Etapa 1 de 4"><span class="po-progress-seg po-progress-done"></span><span class="po-progress-seg"></span><span class="po-progress-seg"></span><span class="po-progress-seg"></span></div></div></div>
        <div class="po-header-slot po-header-slot-end"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Ajuda" title="Ajuda"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">help</span></span></button></div>
      </header>
      <div class="page page-ds otp-page">
        <div class="po-heading po-heading-spaced">
          <h1 class="po-heading-title po-heading-neutral">Insira o seu código</h1>
          <div class="po-contact">
            <span class="po-contact-value"><span class="po-icon s16" aria-hidden="true">sms</span><span data-bind="phone">(11) 9****-5432</span></span>
            <button type="button" class="po-contact-edit" data-go="editar-celular"><span class="po-icon s18" aria-hidden="true">edit_square</span>Editar Celular</button>
          </div>
          <p class="po-heading-sub">Enviamos um código de 6 dígitos por SMS para o seu celular.</p>
        </div>
        <div class="otp-block" data-otp="sms"><div class="po-otp po-otp-default"><div class="po-otp-row" role="group" aria-label="Código de verificação"><input class="po-otp-cell" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Dígito 1 de 6"><input class="po-otp-cell" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Dígito 2 de 6"><input class="po-otp-cell" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Dígito 3 de 6"><span class="po-otp-sep" aria-hidden="true"></span><input class="po-otp-cell" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Dígito 4 de 6"><input class="po-otp-cell" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Dígito 5 de 6"><input class="po-otp-cell" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Dígito 6 de 6"></div><p class="po-otp-msg" hidden=""></p></div><div class="otp-feedback"></div></div>
      </div>
      <p class="po-resend"><span>Não recebeu o código?</span><button type="button" class="po-resend-action" data-resend="sms">Reenviar código</button></p>
      <footer class="po-legal">© 2026 Ellena. Todos os direitos reservados.</footer>
    </section>

</div>
</body>
</html>
