<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOC-01 · Seleção de documento · CNH aberta</title>
<!-- Handoff Palmeiras · Onboarding. Tela DOC-01 (documento), variante "CNH aberta".
     Marcação renderizada da implementação atual (inclui o conteúdo gerado por script), isolada desta tela.
     Comportamento, regras e ligações: spec.md nesta pasta. Fonte de verdade de componentes: DS Palmeiras · Onboarding. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/tokens-onboarding.css">
<link rel="stylesheet" href="../../design-system/components.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../liveness.css">
<link rel="stylesheet" href="../../area.css">
<link rel="stylesheet" href="../../photo.css">
<link rel="stylesheet" href="../../header.css">
<link rel="stylesheet" href="../../ajustes-ds.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../../select.css">
<link rel="stylesheet" href="../../desvincular.css">
<link rel="stylesheet" href="../../familiar-busca.css">
<link rel="stylesheet" href="../../familiar-pendentes.css">
<!-- Moldura fixa 375×812 em qualquer largura de janela (o app.css troca para altura automática abaixo de 720px). -->
<!-- O components.css dá padding de 16px ao body; aqui a moldura fica colada no canto superior esquerdo. -->
<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>
</head>
<body>
<div class="device">
<section class="screen screen-white" id="documento" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-module">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar" data-go="status"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>
        <div class="po-header-center"><div class="po-progress po-header-progress"><span class="po-progress-label">Etapa 2 de 4 · Captura de documentos</span><div class="po-progress-track" role="progressbar" aria-label="Captura de documentos" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2" aria-valuetext="Etapa 2 de 4"><span class="po-progress-seg po-progress-done"></span><span class="po-progress-seg po-progress-done"></span><span class="po-progress-seg"></span><span class="po-progress-seg"></span></div></div></div>
        <div class="po-header-slot po-header-slot-end"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Ajuda" title="Ajuda"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">help</span></span></button></div>
      </header>
      <div class="page page-ds">
        <div class="po-heading heading-doc">
          <h1 class="po-heading-title po-heading-neutral">Escolha um documento</h1>
          <p class="po-heading-sub">Selecione um dos documentos listados abaixo para continuar com a validação.</p>
        </div>
        <div class="doc-list" role="radiogroup" aria-label="Documento de identidade" id="doc-list">
          <div class="po-docopt" data-doc="cin">
            <label class="po-docopt-head" for="doc-cin">
              <input id="doc-cin" type="radio" class="po-docopt-input" name="documento" value="cin" aria-expanded="false" aria-controls="doc-cin-panel">
              <span class="po-docopt-radio" aria-hidden="true"></span>
              <span class="po-docopt-text">
                <span class="po-docopt-title"><span>CIN</span><span class="po-badge po-badge-success">Aprovação mais rápida</span></span>
                <span class="po-docopt-desc">Carteira de Identidade Nacional</span>
              </span>
              <span class="po-docopt-chevron"><span class="po-icon s20" aria-hidden="true">keyboard_arrow_down</span></span>
            </label>
          </div>
          <div class="po-docopt po-docopt-selected" data-doc="cnh">
            <label class="po-docopt-head" for="doc-cnh">
              <input id="doc-cnh" type="radio" class="po-docopt-input" name="documento" value="cnh" aria-expanded="true" aria-controls="doc-cnh-panel">
              <span class="po-docopt-radio" aria-hidden="true"></span>
              <span class="po-docopt-text">
                <span class="po-docopt-title"><span>CNH</span><span class="po-badge po-badge-success">Aprovação mais rápida</span></span>
                <span class="po-docopt-desc">Carteira Nacional de Habilitação</span>
              </span>
              <span class="po-docopt-chevron po-docopt-chevron-up"><span class="po-icon s20" aria-hidden="true">keyboard_arrow_down</span></span>
            </label>
          <div class="po-docopt-panel" id="doc-cnh-panel">
            <button type="button" class="po-action" data-go="liv-tutorial"><span class="po-action-icon"><span class="po-icon s32" aria-hidden="true">photo_camera</span></span><span class="po-action-label">Tirar foto do documento</span><span class="po-action-arrow"><span class="po-icon s20" aria-hidden="true">chevron_right</span></span></button>
            <button type="button" class="po-action" data-go="liv-tutorial"><span class="po-action-icon"><span class="po-icon s32" aria-hidden="true">upload</span></span><span class="po-action-label">Fazer upload do documento</span><span class="po-action-arrow"><span class="po-icon s20" aria-hidden="true">chevron_right</span></span></button>
          </div></div>
          <div class="po-docopt" data-doc="rg">
            <label class="po-docopt-head" for="doc-rg">
              <input id="doc-rg" type="radio" class="po-docopt-input" name="documento" value="rg" aria-expanded="false" aria-controls="doc-rg-panel">
              <span class="po-docopt-radio" aria-hidden="true"></span>
              <span class="po-docopt-text">
                <span class="po-docopt-title"><span>RG</span><span class="po-badge po-badge-warning">Aprovação pode demorar mais</span></span>
                <span class="po-docopt-desc">Registro Geral</span>
              </span>
              <span class="po-docopt-chevron"><span class="po-icon s20" aria-hidden="true">keyboard_arrow_down</span></span>
            </label>
          </div>
        </div>
        <template id="doc-actions">
          <div class="po-docopt-panel">
            <button type="button" class="po-action" data-go="liv-tutorial"><span class="po-action-icon"><span class="po-icon s32" aria-hidden="true">photo_camera</span></span><span class="po-action-label">Tirar foto do documento</span><span class="po-action-arrow"><span class="po-icon s20" aria-hidden="true">chevron_right</span></span></button>
            <button type="button" class="po-action" data-go="liv-tutorial"><span class="po-action-icon"><span class="po-icon s32" aria-hidden="true">upload</span></span><span class="po-action-label">Fazer upload do documento</span><span class="po-action-arrow"><span class="po-icon s20" aria-hidden="true">chevron_right</span></span></button>
          </div>
        </template>
      </div>
      <footer class="po-legal">© 2026 Ellena. Todos os direitos reservados.</footer>
    </section>
</div>
</body>
</html>
