<!-- Moldura fixa 375×812 em qualquer largura de janela (o app.css troca para altura automática abaixo de 720px). -->
<!-- O components.css dá padding de 16px ao body; aqui a moldura fica colada no canto superior esquerdo. -->
<style>html,body{margin:0!important;padding:0!important;background:var(--bg-page,#f8f9fa)} .device{width:375px!important;height:812px!important;min-height:0!important;max-width:none!important;border-radius:0} .device .screen{height:812px!important;min-height:0!important}</style>

<body>
<div class="device">
<section class="screen screen-page" id="familiar-decisao" data-screen="">
      <div class="statusbar statusbar-white"><span>9:41</span></div>
      <header class="po-header po-header-task">
        <div class="po-header-slot"><button type="button" class="po-btn po-iconbtn po-btn-subtle po-iconbtn-sm po-header-action" aria-label="Voltar" title="Voltar" data-go="familiar-cadastro"><span class="po-btn-content"><span class="po-icon" aria-hidden="true">chevron_left</span></span></button></div>
        <div class="po-header-center"><p class="po-header-title">Cadastrar familiar</p></div>
        <div class="po-header-slot po-header-slot-end"></div>
      </header>
      <div class="page page-ds">
        <div class="po-heading">
          <h1 class="po-heading-title po-heading-neutral">Como deseja concluir o cadastro?</h1>
          <p class="po-heading-sub">Você pode preencher agora, no seu celular, ou enviar um convite para o familiar confirmar os próprios dados.</p>
        </div>
        <div class="familiar-options familiar-options-stacked">
          <button type="button" class="po-optcard po-optcard-stacked" id="decisao-cadastrar">
            <span class="po-optcard-head"><span class="po-optcard-lead"><span class="po-optcard-icon"><span class="po-icon s20" aria-hidden="true">person_add</span></span><span class="po-optcard-title">Cadastrar agora</span></span><span class="po-optcard-arrow"><span class="busca-option-go"><span class="po-icon s20" aria-hidden="true">arrow_forward</span></span></span></span>
            <span class="po-optcard-desc">Preencha os dados e tire as fotos do documento e do rosto do familiar no seu celular.</span>
          </button>
          <button type="button" class="po-optcard po-optcard-stacked" id="decisao-convite">
            <span class="po-optcard-head"><span class="po-optcard-lead"><span class="po-optcard-icon"><span class="po-icon s20" aria-hidden="true">send</span></span><span class="po-optcard-title">Enviar convite</span></span><span class="po-optcard-arrow"><span class="busca-option-go"><span class="po-icon s20" aria-hidden="true">arrow_forward</span></span></span></span>
            <span class="po-optcard-desc">O familiar recebe o convite por e-mail ou SMS e confirma os próprios dados.</span>
          </button>
        </div>
      </div>
      <footer class="po-legal">© 2026 Ellena. Todos os direitos reservados.</footer>
    </section>

</div>
</body>
